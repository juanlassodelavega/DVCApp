<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVCApp | Startup registration</title>
  <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <main class="auth-shell">
    <div class="container py-4 py-lg-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
          <section class="surface auth-card">
            <p class="eyebrow mb-1">Startup profile</p>
            <h1 class="h2 mb-3">Register your company</h1>
            <p class="text-body-secondary mb-4">Add the minimum information needed to introduce your startup to investors.</p>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="startupName">Startup name</label>
                <input type="text" id="startupName" class="form-control" placeholder="Company name">
              </div>
              <div class="col-12">
                <label class="form-label" for="fundingTarget">Funding target in ETH</label>
                <input type="number" id="fundingTarget" class="form-control" placeholder="25" min="0" step="0.1">
              </div>
              <div class="col-12">
                <label class="form-label" for="startupDescription">Description</label>
                <textarea id="startupDescription" class="form-control" rows="4" placeholder="Summarize what your company does"></textarea>
              </div>
            </div>
            <button type="button" id="registerStartupButton" class="btn btn-primary w-100 mt-4">Submit profile</button>
            <div class="auth-links mt-4">
              <a href="./index.html">Back to sign in</a>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/registerStartup.js"></script>
</body>
</html>

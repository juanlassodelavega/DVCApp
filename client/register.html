<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVCApp | Register</title>
  <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <main class="auth-shell">
    <div class="container py-4 py-lg-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
          <section class="surface auth-card">
            <p class="eyebrow mb-1">Create account</p>
            <h1 class="h2 mb-3">Register your profile</h1>
            <p class="text-body-secondary mb-4">Create either an investor account or a startup account to continue into the demo.</p>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="name">First name</label>
                <input type="text" id="name" class="form-control" placeholder="Jane">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="surname">Last name</label>
                <input type="text" id="surname" class="form-control" placeholder="Doe">
              </div>
              <div class="col-12">
                <label class="form-label" for="username">Email</label>
                <input type="email" id="username" class="form-control" placeholder="jane@company.com">
              </div>
              <div class="col-12">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password">
              </div>
            </div>
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="isStartup">
              <label class="form-check-label" for="isStartup">I am registering a startup</label>
            </div>
            <button type="button" id="registerButton" class="btn btn-primary w-100 mt-4">Continue</button>
            <div class="auth-links mt-4">
              <a href="./index.html">Already have an account? Sign in</a>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/register.js"></script>
</body>
</html>

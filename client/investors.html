<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVCApp | Startup dashboard</title>
  <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <main class="app-shell">
    <div class="container">
      <section class="surface hero-panel mb-4">
        <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
          <div>
            <p class="eyebrow">Startup workspace</p>
            <h1 class="display-6 mb-3">Investor relations and profile management.</h1>
            <p class="lead text-body-secondary mb-0">
              Review your startup profile, keep track of backers, and manage the narrative from one polished dashboard.
            </p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button type="button" class="btn btn-outline-light btn-sm" id="editStartup">Edit profile</button>
            <button type="button" class="btn btn-outline-warning btn-sm" id="cancelInvestment">Close commitment</button>
            <a href="index.html" class="btn btn-outline-light btn-sm">Sign out</a>
          </div>
        </div>
        <div class="row g-3 mt-4">
          <div class="col-md-4">
            <div class="metric-card">
              <span class="metric-label">Wallet</span>
              <strong id="account" class="metric-value">Not connected</strong>
            </div>
          </div>
          <div class="col-md-4">
            <div class="metric-card">
              <span class="metric-label">Balance</span>
              <strong id="balance" class="metric-value">0 ETH</strong>
            </div>
          </div>
          <div class="col-md-4">
            <div class="metric-card">
              <span class="metric-label">Connection</span>
              <strong id="connectionState" class="metric-value">Waiting for wallet</strong>
            </div>
          </div>
        </div>
      </section>

      <div class="row g-4">
        <div class="col-lg-4">
          <section class="surface p-4 h-100">
            <p class="eyebrow mb-1">Featured startup</p>
            <div id="featuredStartup"></div>
          </section>
        </div>
        <div class="col-lg-8">
          <section class="surface p-4 h-100">
            <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap mb-4">
              <div>
                <p class="eyebrow mb-1">Investors</p>
                <h2 class="h4 mb-0">Active commitments</h2>
              </div>
            </div>
            <div id="investorList" class="vstack gap-3"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/investors.js"></script>
</body>
</html>

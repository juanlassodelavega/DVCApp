<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVCApp | Password reset</title>
  <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <main class="auth-shell">
    <div class="container py-4 py-lg-5">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-5">
          <section class="surface auth-card">
            <p class="eyebrow mb-1">Account recovery</p>
            <h1 class="h2 mb-3">Reset your password</h1>
            <p class="text-body-secondary mb-4">Enter the email address associated with your account and we will send reset instructions.</p>
            <label class="form-label" for="resetEmail">Email</label>
            <input type="email" id="resetEmail" class="form-control" placeholder="name@company.com">
            <button type="button" id="resetButton" class="btn btn-primary w-100 mt-4">Send reset email</button>
            <div class="auth-links mt-4">
              <a href="./index.html">Back to sign in</a>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/passwordReset.js"></script>
</body>
</html>
